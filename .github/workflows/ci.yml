name: Check the tree

# The pull request's cheap gate, then the whole gate on main and nightly. The
# fast run reads no feed and no secret: verify --fast builds what it needs from
# the synthetic feed, and nothing is uploaded. The full run is the one that
# takes 35 minutes, so a pull request never pays for it twice.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the sources
        run: |
          python -m pip install actionlint-py==1.7.12.25 hypothesis==6.170.13
          python -m tools.verify --fast

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The recorded full gate is 35 minutes (docs/build-performance-findings.md).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify every source
        run: |
          python -m pip install actionlint-py==1.7.12.25 hypothesis==6.170.13 mypy==2.4.0
          python -m tools.verify --full
