name: Check a pull request

# The deploy's cheap gate, on a pull request, so a broken parser fails in
# minutes and before main rather than in the hours-long release. It reads no
# feed and no secret: verify --fast builds what it needs from the synthetic
# feed, and nothing is uploaded.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the sources
        run: |
          python -m pip install actionlint-py==1.7.12.25 hypothesis==6.170.13
          python -m tools.verify --fast
