# Build the station pages and publish the site.
#
# The host is a choice, and the workflow leaves it to the repository's
# settings rather than hardcoding one. GitHub Pages is the default path
# below because it is free and this is a static site; the site is plain
# files either way, so any host that serves a folder works -- point another
# provider's deploy action, or an rsync/FTP step, at the _site/ artifact
# this workflow already uploads.
#
# Required once, in the repository settings:
#   Settings -> Pages -> Source: GitHub Actions.
#
# The workflow downloads the licensed feeds from the National Rail Data Portal,
# audits them, tests the application, and publishes only when all of those steps
# pass. Add NRDP_USERNAME and NRDP_PASSWORD as repository secrets before enabling
# the schedule; they are never written to the manifest or logs.
#
# The scheduled run is UTC 03:17 daily. GitHub may delay scheduled jobs, but
# a failed audit prevents publication rather than deploying questionable data.
#
# When the deploy targets a subpath (a project site like
# owner.github.io/repo/), set the repository variable SITE_BASE_PATH to the
# path (e.g. trainbudget) so every internal link is prefixed to match.

name: build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.feed_check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the message check below walks the commits this push
          # added, which needs the base commit to be in the clone. The
          # repository is small enough that fetching it whole is cheaper than
          # the extra step of fetching a base that may not be there.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The commit convention was documented and checked by a tool that
      # rejected all 87 commits in the repository, so it was enforced by
      # nobody. The tool now agrees with the history, and this step is what
      # keeps them agreeing. A scheduled or manual run adds no commits, so it
      # checks nothing and says so rather than passing silently.
      - name: Check the commit messages this push added
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "This run added no commits, so there is no message to check."
            exit 0
          fi
          # A base commit that is not in this clone is the one case where the
          # range cannot be walked. A force-push drops the old tip from the
          # remote, so a full-history checkout does not have it -- and an
          # unwalkable range iterates nothing, which would leave this step
          # reporting success having checked no commit at all. That is the one
          # outcome a gate must never produce, so it fails and says why.
          if ! git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
            echo "::error title=commit message::base commit $BEFORE is not in this clone, so the messages of this push could not be checked. Re-run the workflow, or push the missing base."
            exit 1
          fi
          FAILED=0
          CHECKED=0
          for sha in $(git rev-list "$BEFORE"..HEAD); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-message.txt"
            CHECKED=$((CHECKED + 1))
            if ! python tools/check_commit_message.py "$RUNNER_TEMP/commit-message.txt"; then
              echo "::error title=commit message::$(git log -1 --format=%s "$sha")"
              FAILED=1
            fi
          done
          if [ "$CHECKED" -eq 0 ]; then
            echo "::error title=commit message::$BEFORE..HEAD contains no commit, so no message was checked."
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "At least one of the $CHECKED commit messages this push added does not follow CONTRIBUTING.md."
          else
            echo "All $CHECKED commit messages this push added follow CONTRIBUTING.md."
          fi
          exit "$FAILED"

      - name: Restore the last successful feed manifest
        uses: actions/cache/restore@v4
        with:
          path: .feed-state
          key: feed-manifest-v3-

      - name: Download the licensed DTD feeds
        # Sends If-None-Match/If-Modified-Since when the restored manifest has a
        # validator, so a day the portal has republished nothing costs one cheap
        # request instead of two large archives, and retries a timeout or 5xx
        # rather than failing the day. A 4xx is never retried: the portal has
        # answered, and asking again will not change its mind. "unchanged" here
        # never advances downloaded_at, so the page's age of the prices stays
        # the age of the data.
        env:
          NRDP_USERNAME: ${{ secrets.NRDP_USERNAME }}
          NRDP_PASSWORD: ${{ secrets.NRDP_PASSWORD }}
        run: python dtd_download.py --output-root feeds

      - name: Download the Knowledgebase reference feeds
        # A separate step, and a tolerant one, on purpose. These are a
        # different subscription from the DTD fares and timetable, so the same
        # credentials do not prove entitlement to them, and a 403 here is a
        # subscription question rather than a fault in this project. The
        # reference feed is a *second opinion* on restriction wording: the page
        # states prices and conditions correctly without it and says plainly
        # that nothing was checked. So a missing subscription must not take the
        # daily build down with it -- but it must be visible, which is what the
        # warning and the continued-on-error are for. Folding this into the DTD
        # step would have made an unanswered subscription question look like a
        # broken downloader.
        continue-on-error: true
        env:
          NRDP_USERNAME: ${{ secrets.NRDP_USERNAME }}
          NRDP_PASSWORD: ${{ secrets.NRDP_PASSWORD }}
        run: |
          if python dtd_download.py --output-root feeds --kb-only; then
            echo "reference feeds downloaded"
          else
            echo "::warning title=reference feed::the Knowledgebase reference feeds could not be downloaded. This is usually an entitlement question, not a fault: they are a different subscription from the DTD fares and timetable. The build will publish prices and conditions, and will say on each page that no independent reference feed was checked."
          fi

      - name: Detect whether the feed changed
        id: feed_check
        shell: bash
        run: |
          mkdir -p .feed-state
          INPUTS=$(sha256sum build_demo_page.py atoc_fares.py page_templates.py | sha256sum | cut -d' ' -f1)
          # Compare what the feeds ARE, not the bytes of the manifest file. The
          # manifest also records when a download was last *checked*, and that
          # moves on every run -- including a run where the portal answered 304
          # and published nothing. A byte comparison would read that as a new
          # feed every single day, and rebuild, retest and republish the
          # identical site every single day.
          CURRENT=$(python dtd_download.py --print-fingerprint feeds/download-manifest.json)
          PREVIOUS=""
          if [ -f .feed-state/download-manifest.json ]; then
            PREVIOUS=$(python dtd_download.py --print-fingerprint .feed-state/download-manifest.json)
          fi
          if [ -n "$PREVIOUS" ] && [ "$CURRENT" = "$PREVIOUS" ] && [ -f .feed-state/build-inputs.sha256 ] && [ "$(cat .feed-state/build-inputs.sha256)" = "$INPUTS" ]; then
            echo "Feeds and build inputs are unchanged; keeping the existing site."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Feeds or build inputs changed; a full audited build is required."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fingerprint the feeds
        # The cache key for the next run, and a number worth having in the log:
        # two runs with the same fingerprint published the same prices.
        id: feed_fingerprint
        run: echo "value=$(python dtd_download.py --print-fingerprint feeds/download-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Audit downloaded feeds
        if: steps.feed_check.outputs.changed == 'true'
        run: python dtd_audit.py --feed feeds/fares --timetable feeds/timetable

      # Audit D2: hold today's measured unsourced count so the gap cannot
      # regrow silently between deliberate review passes. The ceiling falls
      # when a reviewed settlement class lands (update it in the same commit);
      # raising it needs a reason in that commit.
      - name: Gate the unsourced-destination count
        run: python destination_coverage.py --feed feeds/fares --unsourced-ceiling 1575

      - name: Restore the timetable index
        # The timetable parse is the expensive part of this build, and it is
        # skipped entirely when the focused index is already on disk: measured
        # on the real feed at Grantham, 1m36s to parse and 11s to read the
        # index back. The cache file is named after a digest of the feed bytes
        # and the stations it serves, so a cache from a different timetable is
        # a different filename and is simply never opened -- a stale restore is
        # a miss, not a wrong answer. Keyed on the interpreter because a pickle
        # is not portable across Python versions.
        uses: actions/cache/restore@v4
        with:
          path: _cache
          key: timetable-index-py312-${{ hashFiles('atoc_timetable.py', 'build_demo_page.py') }}-

      - name: Build the site from audited fares
        # Times and changes, not just prices. The national timetable is what
        # the page's journey columns are computed from, and a build without it
        # publishes prices that a reader cannot plan around.
        #
        # A real-feed build is refused unless it carries a licence notice and a
        # privacy contact (ADR-0032, gates S36-S38 in the re-envision audit).
        # The notices below satisfy the licence condition. The contact comes
        # from the project itself -- PROJECT_PRIVACY_CONTACT in
        # build_demo_page.py -- so this build cannot fail for want of one, and
        # vars.PRIVACY_CONTACT overrides it where an operator would rather
        # publish a different route. Set that variable to the address the
        # publish checklist §1 has confirmed, not to the project's default,
        # which has not been confirmed as monitored.
        #
        # The bound is measured, not hoped for: 1m36s cold and 11s warm on the
        # real feed, one origin, on the runner this runs on. Ten minutes is
        # roughly four times the cold figure, which is enough for a busier
        # runner and little enough that a build which has stopped making
        # progress fails the day rather than occupying a runner until the job
        # limit kills it. Raising it needs the measurement redone, not a
        # hunch.
        timeout-minutes: 10
        if: steps.feed_check.outputs.changed == 'true'
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
          PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
        run: |
          BASE_ARGS=()
          if [ -n "$SITE_BASE_PATH" ]; then
            BASE_ARGS+=(--base-path "$SITE_BASE_PATH")
          fi
          # The fares feed is the public price source. The national timetable
          # is what supplies the journey times, so it is loaded for the date
          # being published rather than left out: without it the page's own
          # opening sentence would promise times it cannot show.
          python build_demo_page.py \
            --feed feeds/fares \
            --timetable feeds/timetable \
            --knowledgebase feeds/knowledgebase \
            --date "$(date -u +%Y-%m-%d)" \
            --origin GRA \
            --out _site/index.html \
            --notices rdg,ogl,accuracy \
            --require-live-reviewed-codes \
            "${BASE_ARGS[@]}"

      - name: Check the release manifest
        if: steps.feed_check.outputs.changed == 'true'
        # S07: the release is a set of routes, written beside the pages and
        # proved against them by the build. This step checks the set an operator
        # or a host would read, so a manifest that went missing between the
        # build and the publish cannot pass unnoticed.
        #
        # And it checks the page kept the promise the timetable was loaded for.
        # A build that quietly lost its journeys -- a date outside the feed's
        # window, a feed that stopped parsing -- would still write a manifest,
        # still pass every test below, and publish a prices-only page under a
        # workflow that says it publishes times. A reader would have no way to
        # tell that from a deliberate change.
        run: |
          if [ ! -s _site/release-manifest.json ]; then
            echo "::error title=release manifest::the build wrote no _site/release-manifest.json, so the routes this release serves are not stated anywhere"
            exit 1
          fi
          ROUTES=$(python -c "import json;print(len(json.load(open('_site/release-manifest.json'))['routes']))")
          PAGES=$(find _site -name index.html | wc -l)
          echo "the manifest names $ROUTES route(s) and the folder holds $PAGES page(s)"
          if [ "$ROUTES" -ne "$PAGES" ]; then
            echo "::error title=release manifest::the manifest names $ROUTES route(s) but the folder holds $PAGES page(s), so the release and the artifact disagree"
            exit 1
          fi
          # The workflow publishes times, so the page must carry them. A build
          # that lost its journeys would otherwise pass every other gate here
          # and ship a prices-only page under a workflow that promises otherwise.
          #
          # Read as JSON rather than grepped, because the payload is minified
          # and a pattern written with a space after the colon would match
          # nothing at all. And the empty case fails: a glob that matches no
          # page would otherwise report nothing missing and pass, which is the
          # one outcome a gate must never produce.
          JOURNEYS=$(python - <<'PY'
          import glob, re, sys

          pages = sorted(glob.glob("_site/from/*/index.html"))
          if not pages:
              print("no station pages were written, so there is nothing to check")
              sys.exit(2)
          missing = []
          for path in pages:
              text = open(path, encoding="utf-8").read()
              found = re.search(r'"hasJourneys":\s*(true|false)', text)
              if not found:
                  missing.append(path + " (no hasJourneys field at all)")
              elif found.group(1) != "true":
                  missing.append(path + " (hasJourneys is false)")
          print(" ".join(missing))
          PY
          ) || { echo "::error title=journeys::the journey check could not run, so this build's times are unverified"; exit 1; }
          if [ -n "$JOURNEYS" ]; then
            echo "::error title=journeys::these station pages carry no journey times, so this build published prices without the times the workflow loads the timetable for: $JOURNEYS. Check that the date is inside the feed's window, which the page prints as timetableFrom/timetableTo."
            exit 1
          fi
          echo "every station page carries journey times"

      - name: Test the build
        # Coverage runs with a floor, not a target (audit C5): unreachable
        # code and untested branches show up in the printed report, and a
        # drop below 79% of the product fails the step. A point and a half
        # of slack over today's 81.2% covers platform variance; the floor
        # lives here next to the number it holds, and lowering it needs a
        # reason.
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          python -m coverage run --append -m unittest discover -s tools -p "test_*.py"
          python -m coverage report --fail-under=79 --precision=1

      - name: Test the page in a real browser
        # The page's claims -- notices, provenance, the picker -- execute in
        # browser JS that the Python suite cannot see (audit C2). Playwright
        # needs a browser; chromium is the lightest.
        #
        # Two pages go through the suite. The synthetic demo feed's is built
        # here, because the suite tests the template rather than a station: it
        # is written against the payload the page carries, so it holds for any
        # origin, and a day's fares cannot fail it. It also means the step has
        # a page on every run, and it is a build with a timetable, so the
        # times and changes columns are driven by something.
        #
        # The other is whatever the site build wrote: _site/index.html today,
        # driven in the same run, so the page that ships is one somebody
        # opened. It is built from the real DTD feeds with the timetable
        # loaded, which the synthetic demo page is not, so the two cover
        # different ground. A full-network build writes a station set
        # under _site/from instead, and the whole set is swept -- the suite
        # reads its expectations out of each page, so a sweep of it is a search
        # for origin-specific template bugs rather than a second copy of the
        # same assertions. Which page sits at the site root is the build's
        # choice -- a station page for one origin, a chooser for the whole
        # network -- so a page that is not a station page is reported and
        # skipped, and a run in which no page was one fails rather than
        # passing having checked nothing.
        #
        # --sweep marks a station set, and no longer changes the standard: a
        # check a page has nothing to exercise (no UNESCO destination, one
        # option in the picker, no second station) is a skip in every mode, and
        # the skip budget is what stops a page that has nothing to exercise
        # from reading as a pass. The run reports how many checks it skipped, and
        # fails when that count is more than a stated fraction of the checks
        # the pages could have run -- so a sweep whose pages have stopped
        # exercising the suite cannot read as a pass, which is what reporting
        # the number alone allowed.
        #
        # The site build above only runs when the feed changed, so on an
        # unchanged run there is no published page to drive and the suite runs
        # against the demo page alone -- rather than against a file that is
        # not there.
        env:
          SITE_BUILT: ${{ steps.feed_check.outputs.changed }}
        run: |
          npx --yes --package playwright playwright install --with-deps chromium
          # --third-origin makes the picker have options; --return-network
          # gives the two secondary origins a set of destinations each, so
          # every station page the suite drives has more than one row. With a
          # single destination a page cannot exercise the shortlist, the party
          # switch, the railcard or a type chip, and those checks became
          # silent skips on two pages out of three.
          python make_synthetic_feed.py _demo_feed --unserved-station --third-origin --return-network --knowledgebase _demo_kb
          # A single-origin build is a site (S01, S04): the chooser is the root
          # index.html and each station sits at its canonical /from/<slug>/
          # route. The demo site is built --all-origins so the synthetic feed's
          # priced stations give the picker real sibling options to exercise, the
          # way a published site does; the suite drives one station page from it.
          # --third-origin is what makes that true: without it only two stations
          # are priced and the picker has a single option and nothing to narrow.
          python build_demo_page.py --feed _demo_feed --timetable _demo_feed --knowledgebase _demo_kb --all-origins --out _demo_site/index.html
          if [ ! -s _demo_site/privacy/index.html ]; then
            echo "::error title=browser test::the demo site wrote no privacy page, so a route every footer links to was never checked"
            exit 1
          fi
          # A build that produced no page must fail the run here, with the
          # reason attached to this step. Otherwise the suite is one skipped
          # step away from passing having tested nothing at all.
          DEMO_STATION=$(ls _demo_site/from/*/index.html 2>/dev/null | head -1 || true)
          if [ -z "$DEMO_STATION" ] || [ ! -s "$DEMO_STATION" ]; then
            echo "::error title=browser test::the demo site built no station page, so the page in a real browser was not tested"
            exit 1
          fi
          PAGES=("$DEMO_STATION" _demo_site/index.html _demo_site/privacy/index.html)
          SWEEP=""
          if [ "$SITE_BUILT" = "true" ]; then
            if [ ! -s _site/index.html ]; then
              echo "::error title=browser test::the site was built but there is no page at _site/index.html, so the page that ships was not tested in a browser"
              exit 1
            fi
            if [ ! -s _site/privacy/index.html ]; then
              echo "::error title=browser test::the site was built but wrote no privacy page, so the route every footer links to was not tested"
              exit 1
            fi
            PAGES+=(_site/index.html _site/privacy/index.html)
            if [ -d _site/from ]; then
              PAGES+=(_site/from)
              SWEEP="--sweep"
            fi
          fi
          npx --yes --package playwright node tests/browser_test.cjs "${PAGES[@]}" $SWEEP

      - name: Save the successful feed manifest and build fingerprint
        if: steps.feed_check.outputs.changed == 'true'
        run: sha256sum build_demo_page.py atoc_fares.py page_templates.py | sha256sum | cut -d' ' -f1 > .feed-state/build-inputs.sha256

      - name: Save the timetable index
        if: steps.feed_check.outputs.changed == 'true'
        # Only written by a build that reached the parse, so a build that failed
        # earlier cannot leave a half-written index behind for the next day to
        # trust. The file is named after a digest of the feed and the stations
        # it serves, so tomorrow's key misses if the timetable moved.
        uses: actions/cache/save@v4
        with:
          path: _cache
          key: timetable-index-py312-${{ hashFiles('atoc_timetable.py', 'build_demo_page.py') }}-${{ steps.feed_fingerprint.outputs.value }}

      - name: Save the successful feed manifest
        if: steps.feed_check.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .feed-state/download-manifest.json
            .feed-state/build-inputs.sha256
          # Keyed on the feed FINGERPRINT, not on the manifest's bytes, so the
          # cache entry is replaced only when the feeds really are different.
          # A key derived from the manifest file itself would produce a new
          # entry every run for the reason described above, and the restore
          # would never match a saved state.
          key: feed-manifest-v3-${{ hashFiles('build_demo_page.py', 'atoc_fares.py', 'page_templates.py') }}-${{ steps.feed_fingerprint.outputs.value }}

      - uses: actions/upload-pages-artifact@v3
        if: steps.feed_check.outputs.changed == 'true'
        with:
          path: _site

  # The licence clearance, as its own job, so that it gates publication and
  # nothing else.
  #
  # Audit C01 found this workflow downloading the licensed DTD feeds, building
  # from them and publishing on any push to main or on the daily schedule, with
  # no licence decision anywhere near it. Every other gate here is a technical
  # one -- an audit, a count, a manifest, a test suite -- and all of them can
  # pass while the one question the publish checklist says blocks everything
  # else is still open. The attribution wording the workflow supplies is not an
  # answer to it: a page can carry every required credit and still be a page
  # nobody has cleared.
  #
  # So the decision is a file, licences/release-clearance.md, edited in a pull
  # request by a person who read the terms. This job refuses the run when the
  # file does not clear the fares feed the build below publishes.
  #
  # It is a job of its own rather than a step, and that placement is the
  # design: `deploy` needs it, so the publish path stops, while the build, the
  # test suite and the browser run stay green. A red licence gate on every push
  # would train people to ignore red. Nothing in build_demo_page.py or run.py
  # reads this file, so a contributor can still build, test and open a real-feed
  # page locally with no clearance in sight -- which is what the audit's action
  # asked to keep ungated.
  #
  # The second half of this gate is not code: required reviewers on the
  # github-pages environment (Settings -> Environments). A workflow cannot
  # require a person to be present, so the record and the environment review are
  # both needed, and only one of them is visible in this file.
  clearance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release clearance
        # `fares,timetable`, because the build above now loads the national
        # timetable to publish times and changes. That is the shape the Darwin
        # product schedule governs, and this project reads that schedule as
        # internal business purposes only -- so this command now demands a
        # clearance nobody holds, and the publish path stops until someone has
        # answered the question in docs/publish-checklist.md §1.
        #
        # That refusal is the point of the gate, not an obstacle to it: the
        # build and its tests stay green, and only publication waits. Passing
        # `fares` here while the build loads a timetable would be a gate
        # declaring a narrower release than the one being published, which is
        # the exact failure this gate exists to make impossible.
        run: python tools/check_release_clearance.py --release fares,timetable

  deploy:
    needs: [build, clearance]
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
